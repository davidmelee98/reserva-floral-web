<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Reserva Floral</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { brandFuchsia: '#c2185b', brandLightPink: '#e91e63', brandDark: '#353535', brandGray: '#f8f9fa' }
                }
            }
        }
    </script>
    <style>
        @keyframes petaloCaer{ 0%{ transform:translateY(-10px) rotate(0deg); opacity:0; } 15%{ opacity:1; } 100%{ transform:translateY(140px) rotate(220deg); opacity:0; } }
        .petalo{ position:absolute; animation: petaloCaer 3.5s ease-in infinite; }
        ::-webkit-scrollbar{ width:7px; height:7px; }
        ::-webkit-scrollbar-thumb{ background:#e2c2d0; border-radius:999px; }
    </style>
</head>
<body class="bg-brandGray font-sans text-brandDark antialiased min-h-screen flex flex-col">

    <header class="bg-brandFuchsia text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16">
                <a href="/" class="flex items-center">
                    <img src="/logo-reserva-floral.png" alt="Reserva Floral" class="w-[170px] h-12 object-contain" draggable="false">
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="max-w-md w-full text-center">
            <div class="relative w-24 h-24 mx-auto mb-6">
                <svg class="w-24 h-24 text-brandLightPink/20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a5 5 0 00-5 5c0 1.5.7 2.83 1.79 3.7A5 5 0 004 15a5 5 0 005 5c1.5 0 2.83-.7 3.7-1.79A5 5 0 0017.5 20a5 5 0 005-5 5 5 0 00-4.5-4.97A5 5 0 0022 6a5 5 0 00-5-5c-1.85 0-3.47.99-4.35 2.47A5 5 0 0012 2z"/></svg>
                <span class="petalo text-lg" style="left:10%; animation-delay:0s;">🌸</span>
                <span class="petalo text-base" style="left:50%; animation-delay:1.1s;">🌸</span>
                <span class="petalo text-lg" style="left:80%; animation-delay:2.1s;">🌸</span>
            </div>
            <h1 class="text-3xl font-serif font-semibold text-brandDark mb-2">Esta página se marchitó</h1>
            <p class="text-sm text-gray-500 mb-8">No encontramos lo que buscas. Puede que el enlace esté mal escrito o que la página ya no exista.</p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="/" class="inline-block bg-brandFuchsia hover:bg-brandLightPink text-white font-semibold px-6 py-3 rounded-full text-sm transition">Volver al inicio</a>
                <a href="/#seccion-catalogo" class="inline-block border border-gray-300 hover:border-brandFuchsia text-brandDark font-semibold px-6 py-3 rounded-full text-sm transition">Ver catálogo</a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-6">
        <p class="text-center text-xs text-gray-400">© <span id="anio-footer"></span> Reserva Floral</p>
    </footer>

    <script>document.getElementById('anio-footer').textContent = new Date().getFullYear();</script>
</body>
</html>
