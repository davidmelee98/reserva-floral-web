<script>

    fetch('/api/configuracion-publica').then(r => r.json()).then(cfg => {
        const numero = (cfg.whatsapp_numero || '').replace(/\D/g, '');
        const link = document.getElementById('ca-link-whatsapp');
        if (numero) link.href = 'https://wa.me/' + numero;
        else link.href = '/cuenta.html';
    }).catch(() => {});

    // =======================================================================
    // Contenido del Centro de Ayuda
    // =======================================================================

        {
            slug: 'seguimiento-cancelaciones',
            titulo: 'Seguimiento y cancelaciones',

                {

    // =======================================================================
    // Render y navegación (basada en el "hash" de la URL, ej. #/cupones-de-descuento)
    // =======================================================================
    function escaparHtmlCA(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderMenuPrincipal() {
        const cont = document.getElementById('ca-lista-categorias');
        cont.innerHTML = CENTRO_AYUDA.map(cat => `
            <a href="#/${cat.slug}" class="flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition">
                <span class="font-medium text-brandDark">${escaparHtmlCA(cat.titulo)}</span>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
            </a>
        `).join('');
    }

    function renderCategoria(slug) {
        const categoria = CENTRO_AYUDA.find(c => c.slug === slug);
        if (!categoria) { window.location.hash = '#/'; return; }

        document.getElementById('ca-categoria-titulo').innerText = categoria.titulo;
        document.getElementById('ca-breadcrumb-actual').innerText = categoria.titulo;
        document.title = `${categoria.titulo} | Centro de Ayuda | Reserva Floral`;

        const cont = document.getElementById('ca-lista-preguntas');
        cont.innerHTML = categoria.preguntas.map((item, i) => `
            <div class="ca-item" data-indice="${i}">
                <div class="ca-pregunta flex items-center justify-between px-5 py-4 select-none" onclick="alternarPreguntaCA(this)">
                    <span class="font-medium text-brandDark pr-4">${escaparHtmlCA(item.q)}</span>
                    <svg class="ca-flecha w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                </div>
                <div class="ca-respuesta px-5 pb-5 -mt-1 text-sm text-gray-600 leading-relaxed">${item.r}</div>
            </div>
        `).join('');
    }

    function alternarPreguntaCA(header) {
        header.closest('.ca-item').classList.toggle('is-abierto');
    }
    window.alternarPreguntaCA = alternarPreguntaCA;

    function enrutarCA() {
        const hash = window.location.hash.replace('#/', '').trim();
        const menu = document.getElementById('ca-vista-menu');
        const vista = document.getElementById('ca-vista-categoria');
        if (!hash) {
            menu.classList.remove('hidden');
            vista.classList.add('hidden');
            document.title = 'Centro de Ayuda | Reserva Floral';
            renderMenuPrincipal();
        } else {
            menu.classList.add('hidden');
            vista.classList.remove('hidden');
            renderCategoria(hash);
            window.scrollTo({ top: 0 });
        }
    }

    window.addEventListener('hashchange', enrutarCA);
    renderMenuPrincipal();
    enrutarCA();
</script>
